name: Build and release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore OP1wBattery.csproj --runtime win-x64

      - name: Build
        run: dotnet build OP1wBattery.csproj --configuration Release --no-restore

      - name: Publish executable
        run: >-
          dotnet publish OP1wBattery.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --no-restore
          -p:PublishSingleFile=true
          --output publish

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v0.0.${{ github.run_number }}"
          "publish/OP1wBattery.exe"
          --target "${{ github.sha }}"
          --title "OP1w Battery v0.0.${{ github.run_number }}"
          --notes "This smaller build requires the .NET 10 Desktop Runtime for Windows. The runtime is not included."
          --generate-notes
